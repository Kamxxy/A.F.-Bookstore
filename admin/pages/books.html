<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin - Books | A.F. Bookstore</title>

    <!-- Shared admin styles -->
    <link
        rel="stylesheet"
        href="/admin-assets/css/admin.css"
    >

    <link
        rel="stylesheet"
        href="/admin-assets/css/sidebar.css"
    >

    <!-- Books page styles -->
    <link
        rel="stylesheet"
        href="/admin-assets/css/books.css"
    >

</head>


<body>


<div class="admin-layout">


    <!-- =====================================================
         SHARED ADMIN SIDEBAR
    ====================================================== -->

    <div id="adminSidebar"></div>


    <!-- =====================================================
         MAIN CONTENT
    ====================================================== -->

    <main class="admin-main">


        <!-- =================================================
             TOP BAR
        ================================================== -->

        <header class="admin-header">

            <div>

                <p class="admin-eyebrow">
                    A.F. BOOKSTORE
                </p>

                <h1>
                    Books
                </h1>

            </div>


            <div class="admin-header-right">

                <span class="admin-status">

                    <span class="status-dot"></span>

                    Online

                </span>


                <button
                    class="admin-menu-btn"
                    type="button"
                    aria-label="Open menu"
                >
                    ☰
                </button>

            </div>

        </header>


        <!-- =================================================
             BOOK MANAGEMENT
        ================================================== -->

        <section class="books-content">


            <div class="top-bar">

                <h2>
                    Manage Books
                </h2>

                <button
                    class="add-btn"
                    onclick="openAddForm()"
                >
                    + Add Book
                </button>

            </div>


            <div
                id="message"
                class="message"
            ></div>


            <!-- =============================================
                 BOOK FORM
            ============================================== -->

            <div
                id="bookFormContainer"
                class="form-container"
            >

                <h3 id="formTitle">
                    Add New Book
                </h3>


                <form
                    id="bookForm"
                    enctype="multipart/form-data"
                >


                    <input
                        type="hidden"
                        id="bookId"
                    >


                    <div class="form-grid">


                        <div class="form-group">

                            <label for="title">
                                Book Title
                            </label>

                            <input
                                type="text"
                                id="title"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label for="author">
                                Author
                            </label>

                            <input
                                type="text"
                                id="author"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label for="price">
                                Price
                            </label>

                            <input
                                type="number"
                                id="price"
                                min="0"
                                step="0.01"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label for="category">
                                Category
                            </label>

                            <input
                                type="text"
                                id="category"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label for="stock">
                                Stock
                            </label>

                            <input
                                type="number"
                                id="stock"
                                min="0"
                                value="0"
                            >

                        </div>


                        <!-- =================================
                             BOOK COVER
                        ================================== -->
                        
                        <div class="form-group">
                        
                            <label for="image">
                                Book Cover
                            </label>
                        
                            <input
                                type="file"
                                id="image"
                                name="image"
                                accept="image/jpeg,image/png,image/webp,image/gif"
                            >
                        
                            <small>
                                JPG, PNG, WEBP or GIF. Maximum 5MB.
                            </small>
                        
                        
                            <!-- Existing cover when editing -->
                        
                            <div
                                id="currentCover"
                                class="current-cover"
                            ></div>
                        
                        
                            <!-- Preview for newly selected image -->
                        
                            <div
                                id="imagePreview"
                                class="image-preview"
                            >
                                <span>
                                    No new cover selected
                                </span>
                            </div>
                        
                        </div>


                        <div class="form-group full">

                            <label for="description">
                                Description
                            </label>

                            <textarea
                                id="description"
                            ></textarea>

                        </div>


                    </div>


                    <div class="form-buttons">

                        <button
                            type="submit"
                            class="save-btn"
                        >
                            Save Book
                        </button>


                        <button
                            type="button"
                            class="cancel-btn"
                            onclick="closeForm()"
                        >
                            Cancel
                        </button>

                    </div>


                </form>

            </div>


            <!-- =============================================
                 BOOK TABLE
            ============================================== -->

            <div class="books-container">

                <table>

                    <thead>

                        <tr>

                            <th>Image</th>

                            <th>Title</th>

                            <th>Author</th>

                            <th>Category</th>

                            <th>Price</th>

                            <th>Stock</th>

                            <th>Actions</th>

                        </tr>

                    </thead>


                    <tbody id="booksTableBody">

                        <tr>

                            <td
                                colspan="7"
                                class="loading"
                            >
                                Loading books...
                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>


        </section>


    </main>


</div>


<!-- =========================================================
     JAVASCRIPT
========================================================= -->

<script src="/admin-assets/js/auth.js"></script>

<script src="/admin-assets/js/sidebar.js"></script>

<script src="/admin-assets/js/books.js"></script>


</body>
</html>
