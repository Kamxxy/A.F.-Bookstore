<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin - Books | A.F. Bookstore</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #111;
            color: #fff;
            min-height: 100vh;
        }

        header {
            background: #000;
            border-bottom: 1px solid #333;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 24px;
        }

        .back-btn {
            color: #fff;
            text-decoration: none;
            border: 1px solid #555;
            padding: 10px 15px;
            border-radius: 5px;
        }

        .back-btn:hover {
            background: #fff;
            color: #000;
        }

        main {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            gap: 15px;
        }

        .top-bar h2 {
            font-size: 28px;
        }

        .add-btn {
            background: #fff;
            color: #000;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .add-btn:hover {
            background: #ccc;
        }

        .form-container {
            background: #1b1b1b;
            border: 1px solid #333;
            padding: 25px;
            border-radius: 8px;
            margin-bottom: 30px;
            display: none;
        }

        .form-container.show {
            display: block;
        }

        .form-container h3 {
            margin-bottom: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        label {
            font-size: 14px;
            color: #ccc;
        }

        input,
        textarea,
        select {
            background: #111;
            color: #fff;
            border: 1px solid #444;
            padding: 12px;
            border-radius: 5px;
            outline: none;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #fff;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .form-buttons {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        .save-btn,
        .cancel-btn {
            padding: 11px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .save-btn {
            background: #fff;
            color: #000;
            border: none;
        }

        .cancel-btn {
            background: transparent;
            color: #fff;
            border: 1px solid #555;
        }

        .books-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #1b1b1b;
            border: 1px solid #333;
        }

        th,
        td {
            padding: 15px;
            border-bottom: 1px solid #333;
            text-align: left;
        }

        th {
            background: #000;
        }

        tr:hover {
            background: #222;
        }

        .book-image {
            width: 55px;
            height: 70px;
            object-fit: cover;
            border-radius: 4px;
            background: #333;
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        .edit-btn,
        .delete-btn {
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }

        .edit-btn {
            background: #fff;
            color: #000;
            border: none;
        }

        .delete-btn {
            background: transparent;
            color: #fff;
            border: 1px solid #666;
        }

        .delete-btn:hover {
            background: #fff;
            color: #000;
        }

        .message {
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }

        .message.show {
            display: block;
        }

        .loading {
            text-align: center;
            padding: 30px;
            color: #aaa;
        }

        @media (max-width: 700px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }

            .top-bar {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>A.F. Bookstore — Admin</h1>
    <a href="/admin" class="back-btn">Dashboard</a>
</header>

<main>

    <div class="top-bar">
        <h2>Manage Books</h2>
        <button class="add-btn" onclick="openAddForm()">+ Add Book</button>
    </div>

    <div id="message" class="message"></div>

    <div id="bookFormContainer" class="form-container">

        <h3 id="formTitle">Add New Book</h3>

        <form id="bookForm">

            <input type="hidden" id="bookId">

            <div class="form-grid">

                <div class="form-group">
                    <label for="title">Book Title</label>
                    <input type="text" id="title" required>
                </div>

                <div class="form-group">
                    <label for="author">Author</label>
                    <input type="text" id="author" required>
                </div>

                <div class="form-group">
                    <label for="price">Price</label>
                    <input type="number" id="price" min="0" step="0.01" required>
                </div>

                <div class="form-group">
                    <label for="category">Category</label>
                    <input type="text" id="category">
                </div>

                <div class="form-group">
                    <label for="stock">Stock</label>
                    <input type="number" id="stock" min="0" value="0">
                </div>

                <div class="form-group">
                    <label for="image">Image URL</label>
                    <input type="text" id="image">
                </div>

                <div class="form-group full">
                    <label for="description">Description</label>
                    <textarea id="description"></textarea>
                </div>

            </div>

            <div class="form-buttons">
                <button type="submit" class="save-btn">Save Book</button>
                <button type="button" class="cancel-btn" onclick="closeForm()">
                    Cancel
                </button>
            </div>

        </form>
    </div>

    <div class="books-container">

        <table>
            <thead>
                <tr>
                    <th>Image</th>
                    <th>Title</th>
                    <th>Author</th>
                    <th>Category</th>
                    <th>Price</th>
                    <th>Stock</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="booksTableBody">
                <tr>
                    <td colspan="7" class="loading">
                        Loading books...
                    </td>
                </tr>
            </tbody>
        </table>

    </div>

</main>

<script>

    const API_URL = "/api/books";

    const formContainer = document.getElementById("bookFormContainer");
    const bookForm = document.getElementById("bookForm");
    const tableBody = document.getElementById("booksTableBody");
    const message = document.getElementById("message");

    let books = [];

    document.addEventListener("DOMContentLoaded", loadBooks);

    async function loadBooks() {

        tableBody.innerHTML = `
            <tr>
                <td colspan="7" class="loading">
                    Loading books...
                </td>
            </tr>
        `;

        try {

            const response = await fetch(API_URL);

            if (!response.ok) {
                throw new Error("Failed to load books");
            }

            books = await response.json();

            renderBooks();

        } catch (error) {

            console.error(error);

            tableBody.innerHTML = `
                <tr>
                    <td colspan="7" class="loading">
                        Failed to load books.
                    </td>
                </tr>
            `;

        }
    }

    function renderBooks() {

        if (!books || books.length === 0) {

            tableBody.innerHTML = `
                <tr>
                    <td colspan="7" class="loading">
                        No books found.
                    </td>
                </tr>
            `;

            return;
        }

        tableBody.innerHTML = books.map(book => {

            return `
                <tr>

                    <td>
                        ${
                            book.image
                            ? `<img src="${escapeHTML(book.image)}"
                                    class="book-image"
                                    alt="${escapeHTML(book.title || "Book")}">`
                            : `<div class="book-image"></div>`
                        }
                    </td>

                    <td>${escapeHTML(book.title || "-")}</td>

                    <td>${escapeHTML(book.author || "-")}</td>

                    <td>${escapeHTML(book.category || "-")}</td>

                    <td>₦${Number(book.price || 0).toLocaleString()}</td>

                    <td>${book.stock ?? 0}</td>

                    <td>
                        <div class="actions">

                            <button
                                class="edit-btn"
                                onclick="editBook('${book.id}')">
                                Edit
                            </button>

                            <button
                                class="delete-btn"
                                onclick="deleteBook('${book.id}')">
                                Delete
                            </button>

                        </div>
                    </td>

                </tr>
            `;

        }).join("");
    }

    function openAddForm() {

        bookForm.reset();

        document.getElementById("bookId").value = "";

        document.getElementById("formTitle").textContent =
            "Add New Book";

        formContainer.classList.add("show");

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });
    }

    function closeForm() {

        formContainer.classList.remove("show");

        bookForm.reset();

        document.getElementById("bookId").value = "";
    }

    function editBook(id) {

        const book = books.find(b => String(b.id) === String(id));

        if (!book) {
            showMessage("Book not found.");
            return;
        }

        document.getElementById("bookId").value = book.id;

        document.getElementById("title").value =
            book.title || "";

        document.getElementById("author").value =
            book.author || "";

        document.getElementById("price").value =
            book.price || "";

        document.getElementById("category").value =
            book.category || "";

        document.getElementById("stock").value =
            book.stock ?? 0;

        document.getElementById("image").value =
            book.image || "";

        document.getElementById("description").value =
            book.description || "";

        document.getElementById("formTitle").textContent =
            "Edit Book";

        formContainer.classList.add("show");

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });
    }

    bookForm.addEventListener("submit", async function (event) {

        event.preventDefault();

        const id = document.getElementById("bookId").value;

        const bookData = {
            title: document.getElementById("title").value.trim(),
            author: document.getElementById("author").value.trim(),
            price: Number(document.getElementById("price").value),
            category: document.getElementById("category").value.trim(),
            stock: Number(document.getElementById("stock").value),
            image: document.getElementById("image").value.trim(),
            description: document.getElementById("description").value.trim()
        };

        try {

            let response;

            if (id) {

                response = await fetch(`${API_URL}/${id}`, {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(bookData)
                });

            } else {

                response = await fetch(API_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(bookData)
                });

            }

            const result = await response.json();

            if (!response.ok) {
                throw new Error(result.error || "Failed to save book");
            }

            showMessage(
                id
                    ? "Book updated successfully."
                    : "Book added successfully."
            );

            closeForm();

            loadBooks();

        } catch (error) {

            console.error(error);

            showMessage(error.message);

        }
    });

    async function deleteBook(id) {

        const confirmed = confirm(
            "Are you sure you want to delete this book?"
        );

        if (!confirmed) {
            return;
        }

        try {

            const response = await fetch(`${API_URL}/${id}`, {
                method: "DELETE"
            });

            const result = await response.json();

            if (!response.ok) {
                throw new Error(result.error || "Failed to delete book");
            }

            showMessage("Book deleted successfully.");

            loadBooks();

        } catch (error) {

            console.error(error);

            showMessage(error.message);

        }
    }

    function showMessage(text) {

        message.textContent = text;

        message.classList.add("show");

        setTimeout(() => {
            message.classList.remove("show");
        }, 4000);
    }

    function escapeHTML(value) {

        const div = document.createElement("div");

        div.textContent = value ?? "";

        return div.innerHTML;
    }

</script>

</body>
</html>
