<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b0b0b">
    <title>You're offline — A.F. Bookstore</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: Inter, Arial, sans-serif;
            background: #0b0b0b;
            color: #f1eee8;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            text-align: center;
        }

        main {
            max-width: 32rem;
            padding: 2rem;
        }

        img {
            width: 5rem;
            height: 5rem;
        }

        h1 {
            font-family: Georgia, serif;
            font-weight: 400;
        }

        p {
            color: #c8c3ba;
            line-height: 1.6;
        }

        a {
            display: inline-block;
            margin-top: 1rem;
            color: #d2b58c;
        }
    </style>
</head>
<body>
    <main>
        <img src="/images/favicon.svg" alt="A.F. Bookstore">
        <h1>You're offline</h1>
        <p>Reconnect to browse books, view your orders, or check out. Your cart and account features need an internet connection.</p>
        <a href="/">Try the bookstore again</a>
    </main>
</body>
</html>
