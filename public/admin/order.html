<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin - Orders | A.F. Bookstore</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #111;
            color: #fff;
            min-height: 100vh;
        }

        header {
            background: #000;
            border-bottom: 1px solid #333;
            padding: 20px 30px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 24px;
        }

        .back-btn {
            color: #fff;
            text-decoration: none;
            border: 1px solid #555;
            padding: 10px 15px;
            border-radius: 5px;
        }

        .back-btn:hover {
            background: #fff;
            color: #000;
        }

        main {
            max-width: 1400px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .top-bar h2 {
            font-size: 28px;
        }

        .refresh-btn {
            background: #fff;
            color: #000;
            border: none;
            padding: 11px 18px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .refresh-btn:hover {
            background: #ccc;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: #1b1b1b;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 20px;
        }

        .stat-card h3 {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 10px;
        }

        .stat-card p {
            font-size: 25px;
            font-weight: bold;
        }

        .filters {
            background: #1b1b1b;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;

            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .filters input,
        .filters select {
            background: #111;
            color: #fff;
            border: 1px solid #444;
            padding: 11px;
            border-radius: 5px;
        }

        .filters input {
            min-width: 250px;
        }

        .orders-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #1b1b1b;
            border: 1px solid #333;
        }

        th,
        td {
            padding: 15px;
            border-bottom: 1px solid #333;
            text-align: left;
            vertical-align: top;
        }

        th {
            background: #000;
            white-space: nowrap;
        }

        tr:hover {
            background: #222;
        }

        .status {
            display: inline-block;
            padding: 6px 10px;
            border: 1px solid #555;
            border-radius: 20px;
            font-size: 12px;
            text-transform: capitalize;
        }

        .order-items {
            font-size: 13px;
            color: #ccc;
            line-height: 1.6;
        }

        .view-btn {
            background: #fff;
            color: #000;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
        }

        .view-btn:hover {
            background: #ccc;
        }

        .loading {
            text-align: center;
            padding: 30px;
            color: #aaa;
        }

        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);

            display: none;
            align-items: center;
            justify-content: center;

            padding: 20px;
            z-index: 1000;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: #1b1b1b;
            border: 1px solid #444;
            border-radius: 8px;

            width: 100%;
            max-width: 650px;
            max-height: 90vh;
            overflow-y: auto;

            padding: 25px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .close-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 25px;
            cursor: pointer;
        }

        .order-detail {
            margin-bottom: 20px;
        }

        .order-detail h3 {
            margin-bottom: 8px;
        }

        .order-detail p {
            color: #ccc;
            margin-bottom: 5px;
        }

        .items-list {
            border-top: 1px solid #333;
            border-bottom: 1px solid #333;
            padding: 10px 0;
        }

        .item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
        }

        .status-select {
            width: 100%;
            background: #111;
            color: #fff;
            border: 1px solid #444;
            padding: 10px;
            border-radius: 5px;
            margin-top: 8px;
        }

        .save-status-btn {
            margin-top: 10px;
            background: #fff;
            color: #000;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        @media (max-width: 800px) {

            .stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .top-bar {
                gap: 15px;
                flex-direction: column;
                align-items: flex-start;
            }
        }

        @media (max-width: 500px) {

            .stats {
                grid-template-columns: 1fr;
            }

        }

    </style>
</head>

<body>

<header>

    <h1>A.F. Bookstore — Admin</h1>

    <a href="/admin" class="back-btn">
        Dashboard
    </a>

</header>


<main>

    <div class="top-bar">

        <h2>Orders</h2>

        <button class="refresh-btn" onclick="loadOrders()">
            Refresh Orders
        </button>

    </div>


    <div class="stats">

        <div class="stat-card">
            <h3>Total Orders</h3>
            <p id="totalOrders">0</p>
        </div>

        <div class="stat-card">
            <h3>Pending</h3>
            <p id="pendingOrders">0</p>
        </div>

        <div class="stat-card">
            <h3>Completed</h3>
            <p id="completedOrders">0</p>
        </div>

        <div class="stat-card">
            <h3>Total Revenue</h3>
            <p id="totalRevenue">₦0</p>
        </div>

    </div>


    <div class="filters">

        <input
            type="text"
            id="searchInput"
            placeholder="Search customer or order ID..."
            oninput="filterOrders()"
        >

        <label for="statusFilter" class="sr-only">
    Filter orders by status
</label>

<select
    id="statusFilter"
    onchange="filterOrders()"
>
    <option value="all">All Statuses</option>
    <option value="pending">Pending</option>
    <option value="processing">Processing</option>
    <option value="shipped">Shipped</option>
    <option value="delivered">Delivered</option>
    <option value="cancelled">Cancelled</option>
</select>

    </div>


    <div class="orders-container">

        <table>

            <thead>

                <tr>
                    <th>Order ID</th>
                    <th>Customer</th>
                    <th>Items</th>
                    <th>Total</th>
                    <th>Status</th>
                    <th>Date</th>
                    <th>Action</th>
                </tr>

            </thead>

            <tbody id="ordersTableBody">

                <tr>
                    <td colspan="7" class="loading">
                        Loading orders...
                    </td>
                </tr>

            </tbody>

        </table>

    </div>

</main>


<!-- ORDER DETAILS MODAL -->

<div
    class="modal"
    id="orderModal"
    onclick="closeModal(event)"
>

    <div
        class="modal-content"
        onclick="event.stopPropagation()"
    >

        <div class="modal-header">

            <h2>Order Details</h2>

            <button
                class="close-btn"
                onclick="closeModal()"
            >
                ×
            </button>

        </div>

        <div id="orderDetails"></div>

    </div>

</div>


<script>

    const API_URL = "/api/orders";

    let orders = [];

    document.addEventListener(
        "DOMContentLoaded",
        loadOrders
    );


    async function loadOrders() {

        const tableBody =
            document.getElementById("ordersTableBody");

        tableBody.innerHTML = `
            <tr>
                <td colspan="7" class="loading">
                    Loading orders...
                </td>
            </tr>
        `;

        try {

            const response =
                await fetch(API_URL);

            if (!response.ok) {
                throw new Error("Failed to load orders");
            }

            orders = await response.json();

            updateStats();

            renderOrders(orders);

        } catch (error) {

            console.error(error);

            tableBody.innerHTML = `
                <tr>
                    <td colspan="7" class="loading">
                        Failed to load orders.
                    </td>
                </tr>
            `;

        }

    }


    function updateStats() {

        const total =
            orders.length;

        const pending =
            orders.filter(
                order =>
                    String(order.status || "")
                        .toLowerCase() === "pending"
            ).length;

        const completed =
            orders.filter(
                order =>
                    String(order.status || "")
                        .toLowerCase() === "delivered"
            ).length;

        const revenue =
            orders.reduce(
                (sum, order) =>
                    sum + Number(
                        order.total ||
                        order.totalAmount ||
                        0
                    ),
                0
            );


        document.getElementById(
            "totalOrders"
        ).textContent = total;

        document.getElementById(
            "pendingOrders"
        ).textContent = pending;

        document.getElementById(
            "completedOrders"
        ).textContent = completed;

        document.getElementById(
            "totalRevenue"
        ).textContent =
            "₦" + revenue.toLocaleString();

    }


    function renderOrders(list) {

        const tableBody =
            document.getElementById(
                "ordersTableBody"
            );


        if (!list || list.length === 0) {

            tableBody.innerHTML = `
                <tr>
                    <td colspan="7" class="loading">
                        No orders found.
                    </td>
                </tr>
            `;

            return;
        }


        tableBody.innerHTML =
            list.map(order => {

                const items =
                    order.items ||
                    order.products ||
                    [];


                const itemText =
                    Array.isArray(items)
                        ? items.map(item =>
                            `${escapeHTML(
                                item.title ||
                                item.name ||
                                "Book"
                            )} × ${item.quantity || 1}`
                        ).join("<br>")
                        : "—";


                const total =
                    Number(
                        order.total ||
                        order.totalAmount ||
                        0
                    );


                const status =
                    order.status ||
                    "pending";


                const customer =
                    order.customerName ||
                    order.name ||
                    order.customer?.name ||
                    "Unknown";


                const date =
                    order.createdAt ||
                    order.date ||
                    order.created ||
                    null;


                return `

                    <tr>

                        <td>
                            #${escapeHTML(
                                String(order.id || "N/A")
                            )}
                        </td>

                        <td>
                            ${escapeHTML(customer)}
                        </td>

                        <td class="order-items">
                            ${itemText}
                        </td>

                        <td>
                            ₦${total.toLocaleString()}
                        </td>

                        <td>

                            <span class="status">
                                ${escapeHTML(status)}
                            </span>

                        </td>

                        <td>
                            ${formatDate(date)}
                        </td>

                        <td>

                            <button
                                class="view-btn"
                                onclick="viewOrder('${order.id}')"
                            >
                                View
                            </button>

                        </td>

                    </tr>

                `;

            }).join("");

    }


    function filterOrders() {

        const search =
            document.getElementById(
                "searchInput"
            ).value
                .toLowerCase()
                .trim();


        const status =
            document.getElementById(
                "statusFilter"
            ).value;


        const filtered =
            orders.filter(order => {

                const customer =
                    order.customerName ||
                    order.name ||
                    order.customer?.name ||
                    "";


                const id =
                    String(order.id || "");


                const matchesSearch =
                    customer
                        .toLowerCase()
                        .includes(search) ||
                    id
                        .toLowerCase()
                        .includes(search);


                const orderStatus =
                    String(
                        order.status ||
                        "pending"
                    ).toLowerCase();


                const matchesStatus =
                    status === "all" ||
                    orderStatus === status;


                return (
                    matchesSearch &&
                    matchesStatus
                );

            });


        renderOrders(filtered);

    }


    function viewOrder(id) {

        const order =
            orders.find(
                order =>
                    String(order.id) === String(id)
            );


        if (!order) {
            return;
        }


        const items =
            order.items ||
            order.products ||
            [];


        const customer =
            order.customerName ||
            order.name ||
            order.customer?.name ||
            "Unknown";


        const email =
            order.email ||
            order.customer?.email ||
            "—";


        const phone =
            order.phone ||
            order.customer?.phone ||
            "—";


        const address =
            order.address ||
            order.shippingAddress ||
            order.customer?.address ||
            "—";


        const total =
            Number(
                order.total ||
                order.totalAmount ||
                0
            );


        const status =
            order.status ||
            "pending";


        const itemsHTML =
            Array.isArray(items)
                ? items.map(item => {

                    const name =
                        item.title ||
                        item.name ||
                        "Book";

                    const quantity =
                        item.quantity || 1;

                    const price =
                        Number(
                            item.price || 0
                        );

                    return `

                        <div class="item">

                            <span>
                                ${escapeHTML(name)}
                                × ${quantity}
                            </span>

                            <span>
                                ₦${(
                                    price *
                                    quantity
                                ).toLocaleString()}
                            </span>

                        </div>

                    `;

                }).join("")
                : "<p>No item information.</p>";


        document.getElementById(
            "orderDetails"
        ).innerHTML = `

            <div class="order-detail">

                <h3>Order #${escapeHTML(
                    String(order.id || "N/A")
                )}</h3>

                <p>
                    Date:
                    ${formatDate(
                        order.createdAt ||
                        order.date ||
                        order.created
                    )}
                </p>

            </div>


            <div class="order-detail">

                <h3>Customer</h3>

                <p>
                    Name: ${escapeHTML(customer)}
                </p>

                <p>
                    Email: ${escapeHTML(email)}
                </p>

                <p>
                    Phone: ${escapeHTML(phone)}
                </p>

                <p>
                    Address: ${escapeHTML(address)}
                </p>

            </div>


            <div class="order-detail">

                <h3>Items</h3>

                <div class="items-list">
                    ${itemsHTML}
                </div>

            </div>


            <div class="order-detail">

                <h3>Total</h3>

                <p>
                    ₦${total.toLocaleString()}
                </p>

            </div>


            <div class="order-detail">

                <h3>Order Status</h3>
                <label for="orderStatus" class="sr-only">
                    Order status
                </label>

                <select
                    id="orderStatus"
                    class="status-select"
                >

                    <option value="pending"
                        ${status === "pending" ? "selected" : ""}>
                        Pending
                    </option>

                    <option value="processing"
                        ${status === "processing" ? "selected" : ""}>
                        Processing
                    </option>

                    <option value="shipped"
                        ${status === "shipped" ? "selected" : ""}>
                        Shipped
                    </option>

                    <option value="delivered"
                        ${status === "delivered" ? "selected" : ""}>
                        Delivered
                    </option>

                    <option value="cancelled"
                        ${status === "cancelled" ? "selected" : ""}>
                        Cancelled
                    </option>

                </select>

                <button
                    class="save-status-btn"
                    onclick="updateOrderStatus('${order.id}')"
                >
                    Update Status
                </button>

            </div>

        `;


        document.getElementById(
            "orderModal"
        ).classList.add("show");

    }


    async function updateOrderStatus(id) {

        const status =
            document.getElementById(
                "orderStatus"
            ).value;


        try {

            const response =
                await fetch(
                    `${API_URL}/${id}`,
                    {
                        method: "PUT",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            status
                        })
                    }
                );


            if (!response.ok) {

                const result =
                    await response.json()
                        .catch(() => ({}));

                throw new Error(
                    result.error ||
                    "Failed to update order"
                );

            }


            closeModal();

            await loadOrders();

            alert(
                "Order status updated successfully."
            );


        } catch (error) {

            console.error(error);

            alert(error.message);

        }

    }


    function closeModal(event) {

        if (
            event &&
            event.target !==
            document.getElementById("orderModal")
        ) {
            return;
        }

        document.getElementById(
            "orderModal"
        ).classList.remove("show");

    }


    function formatDate(date) {

        if (!date) {
            return "—";
        }

        const parsed =
            new Date(date);

        if (isNaN(parsed.getTime())) {
            return "—";
        }

        return parsed.toLocaleString();

    }


    function escapeHTML(value) {

        const div =
            document.createElement("div");

        div.textContent =
            value ?? "";

        return div.innerHTML;

    }

</script>

</body>
</html>
