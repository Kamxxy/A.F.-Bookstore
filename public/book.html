<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Book — A.F. Bookstore</title>

    <meta
        name="description"
        content="Discover your next story at A.F. Bookstore."
    >

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/cart.css">
    <!--link rel="stylesheet" href="css/shop.css"-->
    <link rel="stylesheet" href="css/book.css">

</head>


<body>

    <!-- ================= HEADER ================= -->

    <header class="header">

        <nav class="navbar">

            <a href="/" class="logo">

                <span>A.F.</span>

                <small>BOOKSTORE</small>

            </a>


            <div class="nav-links">

                <a href="/">
                    Home
                </a>

                <a
                    href="/shop"
                    class="active"
                >
                    Books
                </a>

                

                <a href="/about">
                    About
                </a>

            </div>


            <div class="nav-actions">

                <button
                    class="cart-btn"
                    id="cartBtn"
                    aria-label="Shopping cart"
                >

                    <span>Cart</span>

                    <b id="cartCount">0</b>

                </button>


                <button
                    class="menu-btn"
                    id="menuBtn"
                    aria-label="Open menu"
                >

                    <span></span>
                    <span></span>

                </button>

            </div>

        </nav>

    </header>


    <!-- ================= MOBILE MENU ================= -->

    <div
        class="mobile-menu"
        id="mobileMenu"
    >

        <button
            class="close-menu"
            id="closeMenu"
        >
            ×
        </button>


        <div class="mobile-links">

            <a href="/">
                Home
            </a>

            <a href="/shop">
                Books
            </a>

            <a href="/about">
                About
            </a>

        </div>

    </div>


    <!-- ================= BOOK DETAILS ================= -->

    <main>

        <section
            class="book-details"
            id="bookDetails"
        >

            <div class="book-loading">

                Loading book...

            </div>

        </section>


        <!-- ================= RELATED BOOKS ================= -->

        <section class="related-books">

            <div class="related-header">

                <div>

                    <p class="eyebrow">
                        KEEP READING
                    </p>

                    <h2>
                        You may also <em>like.</em>
                    </h2>

                </div>


                <a href="/shop">
                    View all books →
                </a>

            </div>


            <div
                class="related-grid"
                id="relatedGrid"
            ></div>

        </section>

    </main>


    <!-- ================= CART ================= -->

    <aside
        class="cart-sidebar"
        id="cartSidebar"
        aria-hidden="true"
    >

        <div class="cart-header">
        
            <div>
                <span class="cart-eyebrow">YOUR COLLECTION</span>
                <h2>Your Bag</h2>
            </div>
        
            <button
                type="button"
                id="closeCart"
                aria-label="Close Shopping cart"
            >
                ×
            </button>
        
        </div>


        <div
            class="cart-items"
            id="cartItems"
        ></div>


        <div class="cart-footer">

            <div class="cart-total">

                <span>
                    Total
                </span>

                <strong id="cartTotal">
                    ₦0
                </strong>

            </div>


            <button class="checkout-btn">

                Proceed to checkout

                <span>→</span>

            </button>

        </div>

    </aside>


    <div
        class="overlay"
        id="overlay"
    ></div>


    <!-- ================= FOOTER ================= -->

    <footer class="footer">

        <div class="footer-top">

            <div class="footer-brand">

                <a
                    href="/"
                    class="logo"
                >

                    <span>A.F.</span>

                    <small>BOOKSTORE</small>

                </a>

                <p>
                    Stories worth keeping.
                </p>

            </div>


            <div class="footer-links">

                <div>

                    <h4>Explore</h4>

                    <a href="/shop">
                        Books
                    </a>

                    <a href="/about">
                        About
                    </a>

                </div>


                <div>

                    <h4>Help</h4>

                    <a href="#">
                        Contact
                    </a>

                    <a href="#">
                        Shipping
                    </a>

                    <a href="#">
                        FAQ
                    </a>

                </div>

            </div>

        </div>


        <div class="footer-bottom">

            <span>
                © 2026 A.F. Bookstore
            </span>

            <span>
                Made for readers.
            </span>

        </div>

    </footer>


    <script src="js/books.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/book.js"></script>

</body>

</html>
